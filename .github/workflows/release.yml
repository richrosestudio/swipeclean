name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional macOS signing (add these as GitHub repo secrets):
          # APPLE_CERTIFICATE
          # APPLE_CERTIFICATE_PASSWORD
          # APPLE_SIGNING_IDENTITY
          # APPLE_ID
          # APPLE_PASSWORD
          # APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Take out the Trash ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            **macOS:** open the `.dmg`, drag TakeOutTheTrash to Applications. If macOS blocks the app because it is unsigned, right-click the app and choose Open once.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
